<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/app/assets/img/gx-logo.png">
<title>سناب بلس — GX Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/assets/css/theme.css">
<link rel="stylesheet" href="/app/assets/css/product.css">
<link rel="stylesheet" href="/app/assets/css/snapchat.css">
</head>
<body>

<div id="navbar-root"></div>

<section class="product-hero" id="productHeroRoot"></section>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div><span class="k">الباقات</span><h2>اختار الباقة المناسبة إلك</h2></div>
    </div>
    <div class="snap-plan-grid" id="snapPlanGrid"></div>
  </div>
</section>

<section class="section" style="background:var(--bg2); padding-top:0;">
  <div class="wrap">
    <div class="section-head">
      <div><span class="k">بيانات الطلب</span><h2>حدد عدد الحسابات ويوزراتها</h2></div>
    </div>

    <div class="order-box">
      <div>
        <div class="order-field">
          <label>عدد الحسابات</label>
          <div class="stepper-row">
            <button type="button" id="accIncBtn">+</button>
            <div class="count" id="accCount">1</div>
            <button type="button" id="accDecBtn">−</button>
          </div>
          <div class="stepper-hint">إذا بدك تفعّل أكثر من حساب بنفس الطلب، زوّد العدد وبتطلعلك خانة يوزر لكل حساب.</div>
        </div>
        <div id="usernameFields"></div>
      </div>

      <div class="order-summary">
        <h3>ملخص الطلب</h3>
        <div class="os-row"><span>المدة</span><span id="sumDuration">—</span></div>
        <div class="os-row"><span>سعر الباقة</span><span id="sumUnitPrice">—</span></div>
        <div class="os-row"><span>عدد الحسابات</span><span id="sumAccounts">1</span></div>
        <div class="os-total">
          <span class="lbl">الإجمالي</span>
          <span class="val" id="sumTotal">—</span>
        </div>
        <div class="order-error" id="orderError"></div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <button class="btn btn-primary btn-block" id="addOrderBtn">🛒 أضف الطلب للسلة</button>
          <button class="btn btn-ghost btn-block" id="buyNowOrderBtn">⚡ اشتري الآن</button>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div><span class="k">المميزات</span><h2>شو رح تحصل عليه بالضبط</h2><p>اضغط على أي ميزة لتشوف تفاصيلها</p></div>
    </div>
    <div class="features-grid" id="featuresGrid"></div>
  </div>
</section>

<section class="section" style="background:var(--bg2);">
  <div class="wrap" id="deliveryRoot"></div>
</section>

<div id="footer-root"></div>
<div id="cart-drawer-root"></div>

<script src="/app/assets/js/products-data.js"></script>
<script src="/app/assets/js/currency.js"></script>
<script src="/app/assets/js/cart.js"></script>
<script src="/app/assets/js/layout.js"></script>
<script src="/app/assets/js/snapchat-page.js"></script>
</body>
</html>

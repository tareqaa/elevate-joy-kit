<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/app/assets/img/gx-logo.png">
<title>تفعيل ويندوز — GX Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/assets/css/theme.css">
<link rel="stylesheet" href="/app/assets/css/product.css">
<link rel="stylesheet" href="/app/assets/css/snapchat.css">
</head>
<body>
<div id="navbar-root"></div>

<section class="product-hero" id="productHeroRoot"></section>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <div><span class="k">النسخ</span><h2>اختار النسخة وطريقة التفعيل</h2></div>
    </div>
    <div class="snap-plan-grid" id="winPlanGrid"></div>
  </div>
</section>

<section class="section" style="background:var(--bg2); padding-top:0;">
  <div class="wrap">
    <div class="section-head">
      <div><span class="k">ملخص الطلب</span><h2>الباقة المختارة</h2></div>
    </div>
    <div class="order-box" style="grid-template-columns:1fr;">
      <div class="order-summary" style="position:static;">
        <h3>تفاصيل الاشتراك</h3>
        <div class="os-row"><span>النسخة</span><span id="winSumEdition">—</span></div>
        <div class="os-row"><span>السعر الأصلي للمفتاح</span><span id="winSumOld" style="text-decoration:line-through; color:var(--gray) !important;">—</span></div>
        <div class="os-total">
          <span class="lbl">سعرنا</span>
          <span class="val" id="winSumTotal">—</span>
        </div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <button class="btn btn-primary btn-block" id="addWinBtn">🛒 أضف الطلب للسلة</button>
          <button class="btn btn-ghost btn-block" id="buyWinBtn">⚡ اشتري الآن</button>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="section-head"><div><span class="k">المميزات</span><h2>شو رح تحصل عليه بالضبط</h2></div></div>
    <div class="features-grid" id="featuresGrid"></div>
  </div>
</section>

<section class="section" style="background:var(--bg2);"><div class="wrap" id="deliveryRoot"></div></section>

<div id="footer-root"></div>
<div id="cart-drawer-root"></div>

<script src="/app/assets/js/products-data.js"></script>
<script src="/app/assets/js/currency.js"></script>
<script src="/app/assets/js/cart.js"></script>
<script src="/app/assets/js/layout.js"></script>
<script src="/app/assets/js/brand-icons.js"></script>
<script src="/app/assets/js/windows-page.js"></script>
</body>
</html>

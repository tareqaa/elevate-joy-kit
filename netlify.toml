## Netlify deployment config
## The storefront static files live under `public/app/` and reference
## absolute paths like `/app/assets/...`, so we publish the whole `public/`
## folder to keep those paths working.

[build]
  publish = "public"
  command = "echo 'Static site — no build step'"

# Root URL → main storefront page
[[redirects]]
  from = "/"
  to = "/app/index.html"
  status = 200

# Pretty URLs like /app/cart/ → /app/cart/index.html
[[redirects]]
  from = "/app/*"
  to = "/app/:splat/index.html"
  status = 200
  conditions = { Path = ["!*.*"] }

# Security & caching headers
[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
